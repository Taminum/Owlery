name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names (lower case)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/owlery-api:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/owlery-api:latest
            ghcr.io/${{ env.OWNER }}/remnascope-api:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/remnascope-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/owlery-web:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/owlery-web:latest
            ghcr.io/${{ env.OWNER }}/remnascope-web:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/remnascope-web:latest

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build agent, AmneziaWG sensor and security agent
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            for cmd in agent awgsensor secagent; do
              name=remnascope-$cmd; [ "$cmd" = awgsensor ] && name=remnascope-awg-sensor
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name-linux-$arch" "./cmd/$cmd"
            done
          done
          # The security agent also runs on Windows, as a service: it reports the machine's resources there.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/remnascope-secagent-windows-$arch.exe" ./cmd/secagent
            # The screen-sharing helper runs in the signed-in person's session; windowsgui so that no console window opens at logon.
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags="-s -w -H=windowsgui" -o "dist/owlery-remote-windows-$arch.exe" ./cmd/owlery-remote
          done
          tar -czf dist/remnascope-deploy-files.tar.gz deploy/agent deploy/router deploy/secagent
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
