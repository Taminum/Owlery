# Same-origin: the SPA and /api share one origin, so no CORS and no tokens in URLs.
# add_header is not inherited into a location that sets its own, so every location includes the shared file.
# The desktop location also takes a plain POST (the login for a ticket): Connection is "upgrade" only for a WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Behind a TLS proxy (production) the peer is the proxy; use the client address it forwards.
    # Only the private ranges are trusted, so a client cannot spoof its own address.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # A terminal or a desktop is a WebSocket that stays open as long as the session: the upgrade, no read timeout.
    location ~ ^/api/v1/servers/[^/]+/(terminal|desktop|screen)$ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_read_timeout 8h;
        proxy_send_timeout 8h;
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host; # keep the port: the API compares it with the browser Origin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    # Agents push access-log lines here over a WebSocket. They authenticate with their own
    # credential; the API refuses anything that sends a browser Origin.
    location /ingest/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The Kawaii Mode pictures are about 5.6 MB and are fetched only when the mode is on. Their names are not
    # hashed, so they are cached for a day rather than for good.
    location /ember/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
